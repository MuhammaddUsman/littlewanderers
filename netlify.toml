[build]
  command = "vite build"
  publish = "dist/client"
[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    # Forces HTTPS on every future visit for a year, including subdomains.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Stops browsers from guessing/"sniffing" a file's type — prevents a
    # non-executable upload from being treated as a script.
    X-Content-Type-Options = "nosniff"
    # Blocks the site from being embedded in an iframe elsewhere — the
    # classic defense against clickjacking.
    X-Frame-Options = "DENY"
    # Don't leak the full referring URL (with query params) to third parties.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable browser features this site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Restricts what this site is allowed to load/run. Images: same-origin,
    # Unsplash (destination photos), and Google Analytics' beacon endpoint.
    # Scripts: same-origin plus Google Tag Manager (serves the GA4 script).
    # Styles/fonts: same-origin plus Google Fonts, which this site's <head>
    # links to directly. connect-src covers same-origin /api/assistant calls
    # plus GA4's data-collection requests.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://images.unsplash.com https://www.google-analytics.com; script-src 'self' https://www.googletagmanager.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.netlify.com; object-src 'none'"
